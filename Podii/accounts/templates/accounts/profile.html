<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Профіль користувача</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        a { color: #3498db; text-decoration: none; display: inline-block; margin-top: 20px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Профіль: {% if profile_user.first_name %}{{ profile_user.first_name }}{% else %}{{ profile_user.username }}{% endif %}</h1>
        <p><strong>Username:</strong> {{ profile_user.username }}</p>
        <p><strong>Email:</strong> {{ profile_user.email }}</p>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h2>Редагувати профіль</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Ім'я:</label>
                <input type="text" name="first_name" value="{{ profile_user.first_name }}">
            </div>
            <div class="form-group">
                <label>Прізвище:</label>
                <input type="text" name="last_name" value="{{ profile_user.last_name }}">
            </div>
            <button type="submit">Зберегти зміни</button>
        </form>

        <a href="{% url 'event_list' %}">← На головну (до списку подій)</a>
    </div>
</body>
</html>
