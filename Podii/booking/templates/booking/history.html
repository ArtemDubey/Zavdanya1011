<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Історія бронювань</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; border: 1px solid #e1e8ed; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: bold; color: #27ae60; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мої бронювання</h1>
        <ul>
            {% for booking in bookings %}
                <li>
                    <div>
                        <strong>{{ booking.event.title }}</strong><br>
                        <small style="color: #7f8c8d;">Дата заходу: {{ booking.event.date|date:"Y-m-d H:i" }}</small>
                    </div>
                    <div>
                        Статус: <span class="status">{{ booking.get_status_display }}</span>
                    </div>
                </li>
            {% empty %}
                <li>У вас поки немає жодних бронювань.</li>
            {% endfor %}
        </ul>

        <br>
        <a href="{% url 'event_list' %}">← До списку подій</a>
    </div>
</body>
</html>
